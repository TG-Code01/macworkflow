name: macOS VNC - CLOUDFLARE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          brew install cloudflare/cloudflare/cloudflared
          echo "✅ Cloudflared Installed!"

      - name: Enable VNC/Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -restart -agent \
            -privs -all \
            -allowAccessFor -allUsers

          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          echo "✅ VNC Enabled!"

      - name: Set VNC Password
        shell: bash
        run: |
          set -e

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -restart -agent \
            -privs -all \
            -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "P@ssw0rd123!"

          echo "✅ VNC Password Set!"

      - name: Start Cloudflare Tunnel
        run: |
          echo "============================================"
          echo "🚀 macOS VNC - CLOUDFLARE TUNNEL"
          echo "============================================"
          echo ""

          cloudflared tunnel --url tcp://localhost:5900 > tunnel.log 2>&1 &

          sleep 20

          echo "🔗 Tunnel URL:"
          cat tunnel.log | grep -o 'https://[^[:space:]]*trycloudflare.com' || true

          echo ""
          echo "✅ TUNNEL STARTED!"
          echo ""
          echo "📋 CONNECTION DETAILS:"
          echo "   VNC ADDRESS: localhost:5900 after running cloudflared locally"
          echo "   PASSWORD: P@ssw0rd123!"
          echo "   OS: macOS"
          echo "   Architecture: $(uname -m)"
          echo "============================================"

      - name: Keep Session Alive
        run: |
          echo "⏳ Session Active - Keeping alive..."
          while true; do
            sleep 60
            echo "✓ Active - $(date '+%H:%M:%S')"
          done
